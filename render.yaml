# Render Blueprint for Lion Safari Ticketing.
#
# Deploys two persistent processes against one managed Postgres database:
#   - lion-safari-web    (next start)      — customer, staff, admin, scanner UI + API
#   - lion-safari-worker (worker:prod)     — ticket delivery + payment reconciliation
#
# The worker exists because payment reconciliation and retryable email delivery
# both need a long-running process holding a queue, not a request/response
# handler — see src/jobs/queue.ts.
#
# Deploy: Render dashboard → New → Blueprint → select this repo. Render reads
# this file and provisions everything below in one step. Values marked
# `sync: false` are prompted for during that flow and are never committed.
#
# Reference: https://render.com/docs/infrastructure-as-code

databases:
  - name: lion-safari-db
    # Paid plan: no 30-day expiry, and Render takes daily backups. Both of those
    # are why real Cashfree payments may run against this one.
    #
    # Backups are Render's, not ours, and they are point-in-time rather than a
    # file you hold. Before anything destructive — scripts/reset-production-data.ts
    # in particular — still take your own `pg_dump`.
    plan: basic_256mb
    region: singapore
    postgresMajorVersion: "16"

  # The dev stack's database. Free, and therefore deleted ~30 days after
  # creation — which is fine, because everything in it is reproducible with
  # db:migrate, db:seed and db:seed:demo.
  - name: lion-safari-db-dev
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: lion-safari-web
    runtime: node
    branch: main
    # Paid: the service stays warm, so no cold start on the first guest of the
    # morning and no 15-minute idle sleep.
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    # The migration runs as a PRE-DEPLOY step, which the paid plan makes
    # available and which is strictly better than putting it in startCommand:
    #
    #   - it runs ONCE per deploy rather than on every process boot;
    #   - if it fails, Render aborts the deploy and leaves the CURRENT version
    #     serving. In startCommand a failure instead takes the service down,
    #     because `&&` stops `npm start` from ever running.
    #
    # That second point is not hypothetical — `drizzle-kit migrate` has been
    # seen to exit non-zero on this project without printing a reason.
    preDeployCommand: npm run db:migrate:prod
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-safari-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Marks this as the real park. Everything under scripts/ refuses to run
      # against an environment that says this, and the ticket prints clean.
      - key: APP_ENV
        value: production
      # The PUBLIC, customer-facing origin. Set this to the Render URL Render
      # assigns on first deploy (or your custom domain), then redeploy —
      # Cashfree's return_url and the webhook registration both depend on it
      # being correct.
      - key: APP_BASE_URL
        sync: false
      # The staff operations origin, e.g. https://staff.your-domain.in.
      #
      # Leave this UNSET to serve staff and customer pages from one host, which
      # is how the app behaves today. Setting it makes src/proxy.ts split the
      # two: /login /counter /admin /scanner /api/scanner serve only from this
      # host and 404 everywhere else, and the customer pages 404 here.
      #
      # Set it only AFTER the staff subdomain has verified and issued TLS in
      # Render. Setting it early makes /login 404 on every other hostname —
      # including this service's .onrender.com URL — which locks you out. The
      # recovery is to clear this value and redeploy.
      - key: STAFF_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKET_PRICE_PAISE
        value: "7500"
      - key: CONVENIENCE_FEE_PAISE
        value: "2000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SYNC_STALE_THRESHOLD_SECONDS
        value: "300"
      - key: RECONCILE_MIN_AGE_MINUTES
        value: "5"
      # SANDBOX while testing (works with Cashfree's test/sandbox keys below).
      # Switch to PRODUCTION only once you've upgraded off the free plan and
      # are ready to take real payments.
      - key: CASHFREE_ENV
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      # Recipients of the nightly bookings CSV (comma-separated). The worker
      # sends it; the web service reads it only to show who it goes to.
      - key: REPORT_EMAIL_TO
        sync: false

  - type: worker
    name: lion-safari-worker
    runtime: node
    branch: main
    # NOT optional, and it cannot be free — Render has no free background-worker
    # tier, so `plan: free` here was unsatisfiable and this service was simply
    # never created. Everything in worker.ts was therefore dead in production:
    #
    #   - ticket emails were never delivered;
    #   - a payment whose webhook was lost was never reconciled, so the customer
    #     stayed PENDING — paid, with no ticket and no path to one;
    #   - unsold counter blanks never expired, which is the ONLY thing bounding
    #     a ticket book's exposure to a single day (src/domain/booking/reserve.ts);
    #   - the nightly reconciliation CSV was never sent.
    #
    # If this service is missing from the Render dashboard, that is what is
    # happening right now.
    plan: starter
    region: singapore
    # No `next build` needed — the worker runs worker.ts directly through tsx
    # and never touches the Next.js app.
    buildCommand: npm ci
    startCommand: npm run worker:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-safari-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Marks this as the real park. Everything under scripts/ refuses to run
      # against an environment that says this, and the ticket prints clean.
      - key: APP_ENV
        value: production
      # Must match the web service's APP_BASE_URL: the worker builds the
      # "View your ticket" link in the ticket email from it. Note Render does not
      # share these between services, so they can silently drift — set both.
      - key: APP_BASE_URL
        sync: false
      # The worker never verifies staff session cookies (only the web process
      # does), so this only needs to satisfy env validation — it does not have
      # to match the web service's value.
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKET_PRICE_PAISE
        value: "7500"
      - key: CONVENIENCE_FEE_PAISE
        value: "2000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SYNC_STALE_THRESHOLD_SECONDS
        value: "300"
      - key: RECONCILE_MIN_AGE_MINUTES
        value: "5"
      # SANDBOX while testing (works with Cashfree's test/sandbox keys below).
      # Switch to PRODUCTION only once you've upgraded off the free plan and
      # are ready to take real payments.
      - key: CASHFREE_ENV
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SUPPORT_PHONE
        sync: false
      # Recipients of the nightly bookings CSV (comma-separated). The worker
      # sends it; the web service reads it only to show who it goes to.
      - key: REPORT_EMAIL_TO
        sync: false

# ---------------------------------------------------------------------------
# Dev stack — the same app, on the `dev` branch, with its own database.
#
# Exists so a change can be sold, scanned, reprinted and reported on by a real
# person before it reaches the counter. Everything here is on Render's free
# plans, which costs nothing and comes with two consequences worth knowing
# rather than discovering:
#
#   - The free database is deleted about 30 days after it is created. Dev data
#     is disposable by design: recreate it, then run db:migrate, db:seed and
#     db:seed:demo. (If Render will not give you a second free database, point
#     DATABASE_URL at a free Neon project instead — nothing else changes.)
#   - Free web services sleep after 15 minutes idle and take about a minute to
#     wake. Tell whoever is testing, or they will report the first page load as
#     a bug.
#
# Promotion to production is a pull request from `dev` to `main`. Merging it is
# the deploy: Render rebuilds the production services and db:migrate:prod runs
# at boot.
# ---------------------------------------------------------------------------

  - type: web
    name: lion-safari-web-dev
    runtime: node
    plan: free
    region: singapore
    branch: dev
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate:prod && npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-safari-db-dev
          property: connectionString
      # NODE_ENV really is production here: this is a genuine HTTPS deployment
      # and needs secure session cookies and a registered service worker. What
      # makes it dev is APP_ENV, which is a separate question — see src/lib/env.ts.
      - key: NODE_ENV
        value: production
      # Turns on the "test system" banner, prints TEST TICKET on every ticket,
      # sends X-Robots-Tag: noindex, and lets the seed and verify scripts run.
      - key: APP_ENV
        value: dev
      - key: APP_BASE_URL
        sync: false
      - key: STAFF_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKET_PRICE_PAISE
        value: "7500"
      - key: CONVENIENCE_FEE_PAISE
        value: "2000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SYNC_STALE_THRESHOLD_SECONDS
        value: "300"
      # Low, so a test booking confirms in about a minute without a tunnel.
      - key: RECONCILE_MIN_AGE_MINUTES
        value: "1"
      # Sandbox only. Never put production payment credentials on this service.
      - key: CASHFREE_ENV
        value: SANDBOX
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # REPORT_EMAIL_TO is deliberately absent. The nightly report already
      # no-ops without a recipient, which is exactly what a test environment
      # wants: no email to a real address from a rehearsal. Ticket delivery is
      # different — MAIL_FROM and BREVO_API_KEY above are intentionally set so
      # the online payment flow can be tested end to end, including delivery.

  - type: worker
    name: lion-safari-worker-dev
    runtime: node
    # Same trap as the production worker: Render has no free background-worker
    # tier, so this one does not exist either and the dev stack does NOT
    # exercise the worker path — reconciliation, ticket email and blank expiry
    # are all untested there. Left free deliberately rather than fixed, because
    # a second paid worker is a spend decision, not a technical one. Raise it to
    # `starter` when a rehearsal needs to cover those paths.
    plan: free
    region: singapore
    branch: dev
    buildCommand: npm ci
    startCommand: npm run worker:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lion-safari-db-dev
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: dev
      - key: APP_BASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TICKET_PRICE_PAISE
        value: "7500"
      - key: CONVENIENCE_FEE_PAISE
        value: "2000"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SYNC_STALE_THRESHOLD_SECONDS
        value: "300"
      - key: RECONCILE_MIN_AGE_MINUTES
        value: "1"
      - key: CASHFREE_ENV
        value: SANDBOX
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
